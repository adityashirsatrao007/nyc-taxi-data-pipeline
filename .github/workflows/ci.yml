name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt + duckdb
        run: pip install dbt-duckdb duckdb
      - name: dbt build (duckdb, local)
        working-directory: dbt/nyc_taxi
        env:
          DBT_TARGET: duckdb
          DUCKDB_PATH: /tmp/nyc_taxi.duckdb
        run: |
          dbt deps
          dbt build --profiles-dir .
